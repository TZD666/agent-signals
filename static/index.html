<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <title>Agent Signals</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Signals" />
    <script>
      try {
        const savedTheme = localStorage.getItem("agent-signals.theme");
        document.documentElement.dataset.theme =
          savedTheme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CODEX MICRO · VIRTUAL ARRAY</p>
          <h1>Agent Signals</h1>
        </div>
        <div class="live-cluster" aria-live="polite">
          <span class="live-pip"></span>
          <span id="connectionLabel">正在连接</span>
          <time id="clock"></time>
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="切换到亮色模式"
            title="切换到亮色模式"
          >☀︎</button>
          <button
            class="theme-toggle history-toggle"
            id="historyToggle"
            type="button"
            aria-expanded="false"
            aria-controls="historyPanel"
            aria-label="费用与历史"
            title="费用与历史"
          >¢</button>
        </div>
      </header>

      <div class="banner" id="banner" role="alert" hidden></div>

      <section class="history-panel" id="historyPanel" hidden aria-label="费用与历史">
        <div class="history-heading">
          <div>
            <p class="platform-index">$</p>
            <h2>费用与历史</h2>
          </div>
          <p class="history-note">Claude 为等效 API 标价 · Codex 为估算 · 只记时间与用量，不含内容</p>
        </div>
        <div class="history-live" id="historyLive"></div>
        <div class="history-list" id="historyList"></div>
      </section>

      <section class="sources" id="sources" aria-label="数据源状态"></section>

      <section class="legend" aria-label="状态图例">
        <span><i class="legend-dot idle"></i>空闲</span>
        <span><i class="legend-dot thinking"></i>思考中</span>
        <span><i class="legend-dot completed"></i>已完成</span>
        <span><i class="legend-dot needs_input"></i>需要输入</span>
        <span><i class="legend-dot stalled"></i>疑似卡死</span>
        <span><i class="legend-dot error"></i>错误</span>
        <span class="legend-note">动态网格 · 无空槽</span>
      </section>

      <!-- 分区由载荷里的 platforms 现生成，模板给出一个分区的 DOM 形状。 -->
      <div id="platforms"></div>

      <template id="platformSection">
        <section class="platform">
          <div class="section-heading">
            <div>
              <p class="platform-index"></p>
              <h2><span class="platform-label"></span> <span class="platform-hint"></span></h2>
            </div>
            <p><strong class="platform-count">0</strong> 个会话</p>
          </div>
          <div class="agent-grid"></div>
        </section>
      </template>

      <footer>
        <p>点击光点，在这台 Mac 上打开对应会话</p>
        <p id="lastUpdated">等待首次同步</p>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
